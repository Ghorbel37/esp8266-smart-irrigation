<!DOCTYPE html>
<!--
  Web page served by the ESP8266.
  This is the readable source: after editing it, run `python minify.py` to rebuild index_html.h,
  the minified copy that the sketch stores in flash. `python simulator.py` serves it on your PC.

  Line breaks next to tags are removed by the minifier, so tags can go on their own lines freely.
  In the scripts, end every statement with a semicolon (the minifier removes the line breaks).
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Irrigation ESP</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/1/1c/Circle-icons-water.svg">
  <!-- Styling comes from the Tailwind CDN, so the phone/PC opening the page needs internet access -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };

    // Follow the device theme unless the user picked one with the toggle (remembered in localStorage)
    const dq = matchMedia('(prefers-color-scheme: dark)');
    function saved() {
      try { return localStorage.theme; } catch (e) {}
    }
    function applyTheme() {
      const t = saved();
      document.documentElement.classList.toggle('dark', t ? t == 'dark' : dq.matches);
    }
    applyTheme();
    dq.addEventListener('change', applyTheme);
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen dark:bg-slate-950 dark:text-slate-100 dark:[color-scheme:dark]">
<main class="max-w-4xl mx-auto p-4 sm:p-6 space-y-4">

  <!-- Title (device name), clock, settings and theme buttons -->
  <header class="flex items-center justify-between gap-2">
    <h1 id="title" class="text-xl sm:text-2xl font-bold truncate"></h1>
    <div class="flex items-center gap-1 shrink-0">
      <span id="clock" class="text-sm text-slate-500 dark:text-slate-400 tabular-nums mr-1">--:--</span>
      <button id="cfgBtn" type="button" aria-label="Device settings" title="Device settings" class="rounded-lg p-2 text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-800">
        <!-- Gear icon -->
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>
      </button>
      <button id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" class="rounded-lg p-2 text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-slate-800">
        <!-- Moon icon in light mode, sun icon in dark mode -->
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
        </svg>
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Shown when the controller doesn't answer -->
  <p id="err" class="hidden rounded-xl bg-red-50 text-red-700 text-sm p-3 dark:bg-red-950 dark:text-red-300"></p>

  <!-- Device settings, opened with the gear button -->
  <form id="cfg" class="hidden bg-white rounded-2xl shadow-sm p-5 space-y-4 dark:bg-slate-900">
    <h2 class="font-semibold">Device settings</h2>
    <div class="grid gap-4 sm:grid-cols-2">
      <label class="text-sm text-slate-600 dark:text-slate-400">
        Device name
        <input id="cfgName" type="text" maxlength="31" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
      </label>
      <label class="text-sm text-slate-600 dark:text-slate-400">
        Relay pin
        <select id="cfgPin" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 bg-white dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100"></select>
      </label>
    </div>
    <label class="flex items-center gap-3 text-sm">
      <input id="cfgHigh" type="checkbox" class="h-4 w-4 accent-sky-600">
      Relay turns on when the pin is HIGH
    </label>
    <p class="text-xs text-slate-500 dark:text-slate-400">Leave it unchecked for relay modules that switch on with a LOW signal (most common).</p>
    <div class="flex items-center gap-3">
      <button class="rounded-xl bg-sky-600 text-white px-5 py-2.5 font-medium hover:bg-sky-700">Save settings</button>
      <button id="cfgCancel" type="button" class="rounded-xl px-4 py-2.5 font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">Cancel</button>
    </div>
  </form>

  <div class="grid gap-4 md:grid-cols-2">

    <!-- Status and manual control -->
    <section class="bg-white rounded-2xl shadow-sm p-5 space-y-5 dark:bg-slate-900">
      <div class="flex items-center gap-3">
        <span id="dot" class="h-3 w-3 shrink-0 rounded-full bg-slate-300 dark:bg-slate-600"></span>
        <div>
          <p id="relay" class="text-lg font-semibold">Loading...</p>
          <p id="next" class="text-sm text-slate-500 dark:text-slate-400"></p>
        </div>
      </div>
      <div>
        <p class="text-xs font-medium uppercase tracking-wide text-slate-500 dark:text-slate-400 mb-2">Mode</p>
        <!-- Styled by render(): the active mode is highlighted -->
        <div class="grid grid-cols-3 gap-2">
          <button data-m="on">Force ON</button>
          <button data-m="clear">Schedule</button>
          <button data-m="off">Force OFF</button>
        </div>
        <label class="mt-3 flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
          Force ON turns off after
          <input id="onMin" type="number" min="1" max="1440" value="60" required class="w-20 rounded-lg border border-slate-300 px-2 py-1 text-slate-800 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
          min
        </label>
      </div>
      <button id="pause" class="w-full rounded-xl border border-slate-300 py-2.5 font-medium hover:bg-slate-50 dark:border-slate-700 dark:hover:bg-slate-800">Pause 5 minutes</button>
    </section>

    <!-- Weekly schedule -->
    <form id="sched" class="bg-white rounded-2xl shadow-sm p-5 space-y-5 dark:bg-slate-900">
      <h2 class="font-semibold">Watering schedule</h2>
      <!-- One toggle button per day, added by the script -->
      <div id="days" class="grid grid-cols-7 gap-1.5"></div>
      <div class="grid grid-cols-2 gap-3">
        <label class="text-sm text-slate-600 dark:text-slate-400">
          Start
          <input id="start" type="time" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
        </label>
        <label class="text-sm text-slate-600 dark:text-slate-400">
          End
          <input id="end" type="time" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-100">
        </label>
      </div>
      <div class="flex items-center gap-3">
        <button class="rounded-xl bg-sky-600 text-white px-5 py-2.5 font-medium hover:bg-sky-700">Save schedule</button>
        <span id="saved" class="text-sm text-emerald-600 dark:text-emerald-400"></span>
      </div>
    </form>

  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  const days = $('days');
  const DAY_LABELS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  let dirty = 0;  // the schedule form has unsaved edits: don't overwrite it with the polled state
  let last = {};  // latest state received from the controller

  // ---- Schedule: day buttons ----
  function paintDay(b) {
    b.className = 'aspect-square rounded-lg text-sm font-semibold ' + (b.dataset.on == '1'
      ? 'bg-sky-600 text-white'
      : 'bg-slate-100 text-slate-500 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-400 dark:hover:bg-slate-700');
  }
  DAY_LABELS.forEach(label => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.dataset.on = '0';
    b.onclick = () => {
      b.dataset.on = b.dataset.on == '1' ? '0' : '1';
      paintDay(b);
      dirty = 1;
    };
    paintDay(b);
    days.append(b);
  });
  $('start').oninput = $('end').oninput = () => dirty = 1;

  // ---- Device settings ----
  // Relay pin choices (board label, GPIO number): only the pins the firmware accepts
  [['D1', 5], ['D2', 4], ['D5', 14], ['D6', 12], ['D7', 13]].forEach(([label, gpio]) => {
    const o = document.createElement('option');
    o.value = gpio;
    o.textContent = label + ' (GPIO' + gpio + ')';
    $('cfgPin').append(o);
  });
  function openCfg() {
    $('cfgName').value = last.name || '';
    $('cfgPin').value = last.pin;
    $('cfgHigh').checked = !!last.activeHigh;
    $('cfg').classList.remove('hidden');
    $('cfgName').focus();
  }
  $('cfgBtn').onclick = () => $('cfg').classList.contains('hidden') ? openCfg() : $('cfg').classList.add('hidden');
  $('cfgCancel').onclick = () => $('cfg').classList.add('hidden');
  $('cfg').onsubmit = async e => {
    e.preventDefault();
    const q = new URLSearchParams({
      name: $('cfgName').value,
      pin: $('cfgPin').value,
      activeHigh: $('cfgHigh').checked ? 1 : 0,
    });
    if (await call('/config', q)) $('cfg').classList.add('hidden');
  };

  // ---- Show the controller's state ----
  function render(s) {
    last = s;
    $('title').textContent = s.name;
    document.title = s.name;
    $('clock').textContent = s.time;
    $('relay').textContent = s.relay ? 'Watering' : 'Not watering';
    $('dot').className = 'h-3 w-3 shrink-0 rounded-full ' + (s.relay ? 'bg-emerald-500 animate-pulse' : 'bg-slate-300 dark:bg-slate-600');

    const pauseMin = Math.ceil(s.paused / 60);
    $('next').textContent =
      s.mode == 'on' ? 'Forced on, ' + Math.ceil(s.onLeft / 60) + ' min left' :
      s.mode == 'off' ? 'Forced off' :
      s.paused > 0 ? 'Paused, ' + pauseMin + ' min left' :
      'Next run: ' + s.next;

    // Highlight the active mode ("auto" is the Schedule button)
    document.querySelectorAll('[data-m]').forEach(b => {
      const active = b.dataset.m == (s.mode == 'auto' ? 'clear' : s.mode);
      b.className = 'rounded-xl py-2.5 text-sm font-medium ' + (active
        ? 'bg-slate-900 text-white dark:bg-sky-600'
        : 'bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700');
    });
    $('pause').textContent = s.paused > 0 ? 'Paused (' + pauseMin + ' min left)' : 'Pause 5 minutes';

    if (!dirty) {
      [...days.children].forEach((b, i) => {
        b.dataset.on = s.days[i] ? '1' : '0';
        paintDay(b);
      });
      $('start').value = s.start;
      $('end').value = s.end;
    }
  }

  // Send a request and show the state it returns. Actions are sent as POST with q as the body
  // (a GET could be triggered by a link preview or another website); without q it's a GET.
  async function call(url, q) {
    try {
      const r = await fetch(url, q && { method: 'POST', body: q });
      if (!r.ok) throw 0;
      const s = await r.json();
      $('err').classList.add('hidden');
      render(s);
      return s;
    } catch (e) {
      $('err').textContent = 'Could not reach the controller. Check that it is powered and on Wi-Fi.';
      $('err').classList.remove('hidden');
    }
  }

  // ---- Mode buttons and pause ----
  // Force ON duration: remembered by this browser only and sent with each Force ON
  try { if (localStorage.onMin) $('onMin').value = localStorage.onMin; } catch (e) {}
  $('onMin').onchange = () => {
    try { localStorage.onMin = $('onMin').value; } catch (e) {}
  };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const on = b.dataset.m == 'on';
    if (on && !$('onMin').reportValidity()) return;
    call('/relay1/' + b.dataset.m, new URLSearchParams(on ? { minutes: $('onMin').value } : {}));
  });
  $('pause').onclick = () => call('/disable', new URLSearchParams());

  // ---- Theme toggle ----
  // Picking the same theme as the device goes back to following the device
  $('theme').onclick = () => {
    const dark = !document.documentElement.classList.contains('dark');
    try {
      if (dark == dq.matches) localStorage.removeItem('theme');
      else localStorage.theme = dark ? 'dark' : 'light';
    } catch (e) {}
    document.documentElement.classList.toggle('dark', dark);
  };

  // ---- Save the schedule ----
  $('sched').onsubmit = async e => {
    e.preventDefault();
    const q = new URLSearchParams();
    [...days.children].forEach((b, i) => {
      if (b.dataset.on == '1') q.append('day', i);
    });
    q.append('startTime', $('start').value);
    q.append('endTime', $('end').value);
    dirty = 0;
    if (await call('/setSchedule', q)) {
      $('saved').textContent = 'Saved';
      setTimeout(() => $('saved').textContent = '', 2000);
    }
  };

  // Load the state now, then refresh it every 5 seconds
  call('/api/state');
  setInterval(() => call('/api/state'), 5000);
</script>
</body>
</html>
